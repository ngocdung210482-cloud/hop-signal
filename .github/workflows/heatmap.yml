name: Tu cap nhat heatmap CoinGlass

# Mỗi 4 giờ (ngay sau khi đóng nến 4H) + mỗi 30 phút kiểm tra cờ can_cap_nhat.json của bot.
on:
  schedule:
    - cron: "5 */4 * * *"
    - cron: "20,50 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "lay_heatmap.py"
      - ".github/workflows/heatmap.yml"

permissions:
  contents: write

concurrency:
  group: heatmap
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Có cần cập nhật không?
        id: can
        run: |
          if [ "${{ github.event.schedule }}" = "20,50 * * * *" ] && [ ! -f can_cap_nhat.json ]; then
            echo "chay=0" >> $GITHUB_OUTPUT; echo "Không có cờ — bỏ qua"
          else
            echo "chay=1" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        if: steps.can.outputs.chay == '1'
        with:
          python-version: "3.11"
      - name: Cài trình duyệt ẩn
        if: steps.can.outputs.chay == '1'
        run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Đọc CoinGlass và cập nhật muc.json
        if: steps.can.outputs.chay == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python lay_heatmap.py
          git config user.name "heatmap-bot"
          git config user.email "heatmap-bot@users.noreply.github.com"
          git add muc.json
          git rm -q --cached can_cap_nhat.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "Bot tự cập nhật cụm thanh lý từ CoinGlass"
            git pull -q --rebase origin main && git push -q
            # push bằng GITHUB_TOKEN không tự kích hoạt workflow khác → bật lại bot quét thanh lý
            curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/quet-thanh-ly.yml/dispatches" \
              -d '{"ref":"main"}' && echo "Đã khởi động lại bot quét thanh lý"
          fi
